[project]
name = "opheliaskey"
version = "0.1.0"
description = "Purchase intelligence for the Ophelia's Key boat project: ingest, normalize, and analyze every dollar."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dateutil>=2.9",
    "typer>=0.12",
    "rich>=13.7",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "google-api-python-client>=2.130",
    "google-auth-oauthlib>=1.2",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "anthropic>=0.40",
    "reportlab>=4.0",
    # Plaid is called over plain REST via httpx; the SDK adds churn without value.
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.4"]

[project.scripts]
okey = "opheliaskey.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opheliaskey"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
