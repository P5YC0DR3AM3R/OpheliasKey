# Deploy the systems console to Netlify.
#
# The other half of the split lives in jekyll-gh-pages.yml, which publishes the
# landing page and the manual to GitHub Pages. Neither workflow touches the
# other's files: this one only ever uploads `systems/`.
#
# Requires two repository secrets:
#   NETLIFY_AUTH_TOKEN  a personal access token from Netlify → User settings →
#                       Applications → New access token
#   NETLIFY_SITE_ID     the API ID of the opheliaskey-systems project, from
#                       Netlify → Project configuration → General → Project ID
name: Deploy the systems console to Netlify

on:
  push:
    branches: ["main"]
    paths:
      - "systems/**"
      - "netlify.toml"
      - ".github/workflows/netlify.yml"
  workflow_dispatch:

concurrency:
  group: "netlify-systems"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: netlify
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Refuse to publish addresses or identifiers
        run: |
          # The console documents architecture only. A MAC address or a private
          # IPv4 address in it means something unsanitized got committed, and
          # this site is public — fail before it ships, not after.
          if grep -nEi '([0-9a-f]{2}:){5}[0-9a-f]{2}' systems/*.html; then
            echo "::error::MAC address found in systems/ — sanitize before deploying"
            exit 1
          fi
          if grep -nE '\b(10|127)\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\b|\b192\.168\.[0-9]{1,3}\.[0-9]{1,3}\b|\b172\.(1[6-9]|2[0-9]|3[01])\.[0-9]{1,3}\.[0-9]{1,3}\b' systems/*.html; then
            echo "::error::private IP address found in systems/ — sanitize before deploying"
            exit 1
          fi
          echo "systems/ is clean"

      - name: Deploy
        id: deploy
        uses: nwtgck/actions-netlify@v3.0
        with:
          publish-dir: ./systems
          production-deploy: true
          deploy-message: ${{ github.event.head_commit.message || 'Manual deploy' }}
          enable-pull-request-comment: false
          enable-commit-comment: false
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        timeout-minutes: 5
