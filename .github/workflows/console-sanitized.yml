# The console is public. This makes sure it stays sanitized.
#
# Netlify deploys systems/ itself: the project is git-linked to this repo and
# builds `main` with no build command, publishing the directory as-is (see
# netlify.toml). So this workflow does not deploy anything — it guards the
# branch, and a failure here stops unsanitized content from reaching main and
# therefore from reaching the public site.
#
# The manual's sanitized systems page is checked on the same terms.
name: Console stays sanitized

on:
  push:
    branches: ["main"]
    paths: ["systems/**", "manual/systems.html"]
  pull_request:
    paths: ["systems/**", "manual/systems.html"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: No MAC addresses
        run: |
          if grep -rnEi '([0-9a-f]{2}:){5}[0-9a-f]{2}' systems/ manual/systems.html; then
            echo "::error::MAC address found — these pages document architecture, not configuration"
            exit 1
          fi
          echo "no MAC addresses"

      - name: No private IPv4 addresses
        run: |
          # RFC 1918 plus loopback. A public page naming an internal host is a
          # map of the boat's network, and the page's own promise is that it
          # omits addresses.
          if grep -rnE '\b(10|127)\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\b|\b192\.168\.[0-9]{1,3}\.[0-9]{1,3}\b|\b172\.(1[6-9]|2[0-9]|3[01])\.[0-9]{1,3}\.[0-9]{1,3}\b' systems/ manual/systems.html; then
            echo "::error::private IP address found — sanitize before merging"
            exit 1
          fi
          echo "no private IP addresses"

      - name: Console is self-contained
        run: |
          # Everything but the webfont stylesheet must be inline, so the page
          # renders the same from Netlify, from http.server and from file://.
          if grep -oE '(src|href)="https?://[^"]+"' systems/index.html \
             | grep -v 'fonts.googleapis.com' \
             | grep -v 'fonts.gstatic.com' \
             | grep -vE '(github\.com|p5yc0dr3am3r\.github\.io|lyricshow\.live)'; then
            echo "::error::console pulls an external asset — inline it or drop it"
            exit 1
          fi
          echo "console is self-contained"
