<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review — Ophelia's Key</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23050a12'/%3E%3Cpath d='M4 21h20l4-6H6z' fill='none' stroke='%234fe3ff' stroke-width='1.6'/%3E%3Ccircle cx='16' cy='10' r='2.4' fill='%23ffb347'/%3E%3Cpath d='M2 25h28' stroke='%234fe3ff' stroke-opacity='.5'/%3E%3C/svg%3E">
<style>
  :root {
    --bg:#0f1419; --panel:#171d24; --line:#232c35; --ink:#e6edf3; --dim:#8b98a5;
    --accent:#4aa3df; --good:#3fb950; --warn:#d29922; --bad:#f85149;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg:#f6f8fa; --panel:#fff; --line:#d8dee4; --ink:#1f2328; --dim:#656d76; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; }
  .wrap { max-width:920px; margin:0 auto; padding:26px 20px 90px; }
  header { display:flex; align-items:baseline; justify-content:space-between;
           gap:14px; margin-bottom:8px; flex-wrap:wrap; }
  h1 { font-size:20px; margin:0; letter-spacing:-.01em; }
  a { color:var(--accent); }
  .progress { height:5px; background:var(--line); border-radius:3px; overflow:hidden;
              margin:14px 0 22px; }
  .progress > i { display:block; height:100%; background:var(--good); width:0;
                  transition:width .25s ease; }
  .meta { color:var(--dim); font-size:13px; font-variant-numeric:tabular-nums; }

  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px;
          padding:22px; }
  .desc { font-size:20px; font-weight:600; letter-spacing:-.01em; line-height:1.35;
          margin:0 0 12px; }
  .facts { display:flex; flex-wrap:wrap; gap:7px; margin-bottom:14px; }
  .facts span { background:var(--line); border-radius:6px; padding:3px 9px; font-size:12.5px;
                font-variant-numeric:tabular-nums; }
  .facts em { color:var(--dim); font-style:normal; margin-right:5px; }
  .hint { border-left:3px solid var(--accent); padding:9px 13px; border-radius:0 7px 7px 0;
          background:var(--bg); font-size:13.5px; margin-bottom:16px; }
  .hint b { font-weight:600; }

  .actions { display:flex; flex-wrap:wrap; gap:9px; align-items:center; margin-top:6px; }
  button { font:inherit; font-size:14px; border:1px solid var(--line); border-radius:8px;
           padding:9px 15px; background:var(--panel); color:var(--ink); cursor:pointer; }
  button:hover:not(:disabled) { border-color:var(--accent); }
  button:disabled { opacity:.4; cursor:default; }
  button.primary { background:var(--good); border-color:var(--good); color:#04170a;
                   font-weight:600; }
  button.danger  { background:var(--bad); border-color:var(--bad); color:#1a0505;
                   font-weight:600; }
  kbd { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11px;
        border:1px solid currentColor; border-radius:4px; padding:0 4px; opacity:.65;
        margin-left:7px; }
  select { font:inherit; font-size:14px; padding:9px 11px; border-radius:8px;
           border:1px solid var(--line); background:var(--panel); color:var(--ink);
           max-width:100%; }
  label.check { display:flex; align-items:center; gap:7px; font-size:13.5px;
                color:var(--dim); cursor:pointer; }

  .queue { margin-top:26px; }
  .queue h2 { font-size:12px; text-transform:uppercase; letter-spacing:.07em;
              color:var(--dim); margin:0 0 10px; font-weight:600; }
  .row { display:flex; gap:12px; align-items:baseline; padding:8px 12px; border-radius:7px;
         cursor:pointer; font-size:13.5px; }
  .row:hover { background:var(--panel); }
  .row.on { background:var(--panel); outline:1px solid var(--accent); }
  .row .amt { margin-left:auto; font-variant-numeric:tabular-nums; color:var(--dim); }
  .row .t { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  .done { text-align:center; padding:60px 20px; }
  .done h2 { font-size:22px; margin:0 0 8px; }
  .toast { position:fixed; left:50%; bottom:26px; transform:translateX(-50%);
           background:var(--panel); border:1px solid var(--line); border-radius:9px;
           padding:11px 17px; font-size:13.5px; box-shadow:0 6px 22px rgba(0,0,0,.28);
           opacity:0; pointer-events:none; transition:opacity .18s; }
  .toast.show { opacity:1; }
  .keys { margin-top:22px; font-size:12.5px; color:var(--dim); }
  .keys kbd { margin:0 3px 0 0; }
</style>
</head>
<body>
<div class="wrap">

  {% include "_nav.html" %}

  <header>
    <h1>Review queue</h1>
    <span class="meta"><a href="/">← dashboard</a></span>
  </header>
  <div class="meta" id="counter">loading…</div>
  <div class="progress"><i id="bar"></i></div>

  <div id="stage"></div>

  <div class="queue" id="queuewrap" hidden>
    <h2>Up next</h2>
    <div id="queue"></div>
  </div>

  <div class="keys">
    <kbd>B</kbd> boat &nbsp; <kbd>P</kbd> personal &nbsp; <kbd>S</kbd> system &nbsp;
    <kbd>O</kbd> whole order &nbsp; <kbd>J</kbd>/<kbd>K</kbd> skip &nbsp; <kbd>Z</kbd> undo
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SYSTEMS = {{ systems_json | safe }};
let items = [], idx = 0, total = 0, undoStack = [], applyOrder = false;

const $ = id => document.getElementById(id);
const money = c => (c < 0 ? "-" : "") + "$" + (Math.abs(c || 0) / 100).toLocaleString(
  undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
const esc = s => String(s ?? "").replace(/[&<>"']/g,
  m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));

function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.remove("show"), 2200);
}

async function load() {
  const res = await fetch("/api/review/queue");
  const data = await res.json();
  items = data.items;
  total = Math.max(total, data.remaining);
  idx = Math.min(idx, Math.max(0, items.length - 1));
  render(data);
}

function render(state) {
  const remaining = state ? state.remaining : items.length;
  const cents = state ? state.remaining_cents : 0;
  $("counter").textContent = remaining
    ? remaining + " item" + (remaining === 1 ? "" : "s") + " left · " + money(cents) + " at stake"
    : "Queue clear";
  $("bar").style.width = total ? ((total - remaining) / total * 100) + "%" : "100%";

  if (!items.length) {
    $("stage").innerHTML =
      '<div class="card done"><h2>Queue clear</h2>' +
      '<p class="meta">Every line item is confirmed boat or personal.</p>' +
      '<p style="margin-top:18px"><a href="/">Back to the dashboard</a></p></div>';
    $("queuewrap").hidden = true;
    return;
  }

  const it = items[idx];
  const opts = SYSTEMS.map(s =>
    '<option value="' + s.key + '"' + (s.key === it.system_key ? " selected" : "") + '>' +
    esc(s.name) + "</option>").join("");

  const facts = [];
  if (it.quantity && it.quantity !== 1) facts.push(["qty", (+it.quantity).toLocaleString()]);
  facts.push(["total", money(it.total_cents)]);
  if (it.unit_price_cents) facts.push(["each", money(it.unit_price_cents)]);
  if (it.vendor) facts.push(["vendor", it.vendor]);
  if (it.ordered_at) facts.push(["ordered", String(it.ordered_at).slice(0, 10)]);
  if (it.order_items > 1) facts.push(["order", it.order_items + " items"]);
  if (it.asin) facts.push(["asin", it.asin]);

  let hint = "";
  if (it.relevance || it.relevance_note) {
    const conf = it.relevance_conf ? " · " + (it.relevance_conf * 100).toFixed(0) + "% confident" : "";
    hint = '<div class="hint"><b>' + esc(it.relevance || "unsure") + "</b>" + esc(conf) +
           (it.relevance_note ? "<br>" + esc(it.relevance_note) : "") + "</div>";
  }

  $("stage").innerHTML =
    '<div class="card">' +
      '<p class="desc">' + esc(it.description) + "</p>" +
      '<div class="facts">' + facts.map(([k, v]) =>
        "<span><em>" + esc(k) + "</em>" + esc(v) + "</span>").join("") + "</div>" +
      hint +
      '<div class="actions">' +
        '<button class="primary" id="bBoat">Boat<kbd>B</kbd></button>' +
        '<button class="danger" id="bPersonal">Personal<kbd>P</kbd></button>' +
        '<select id="sys">' + opts + "</select>" +
      "</div>" +
      '<div class="actions" style="margin-top:12px">' +
        '<label class="check"><input type="checkbox" id="ord"' +
          (applyOrder ? " checked" : "") + (it.order_items > 1 ? "" : " disabled") +
          "> apply to all unresolved items in this order<kbd>O</kbd></label>" +
        '<button id="bSkip" style="margin-left:auto">Skip<kbd>J</kbd></button>' +
        '<button id="bUndo"' + (undoStack.length ? "" : " disabled") +
          ">Undo<kbd>Z</kbd></button>" +
      "</div>" +
    "</div>";

  $("bBoat").onclick = () => decide("boat");
  $("bPersonal").onclick = () => decide("personal");
  $("bSkip").onclick = () => { idx = (idx + 1) % items.length; render(); };
  $("bUndo").onclick = undo;
  $("ord").onchange = e => { applyOrder = e.target.checked; };

  $("queuewrap").hidden = items.length < 2;
  $("queue").innerHTML = items.map((q, i) =>
    '<div class="row' + (i === idx ? " on" : "") + '" data-i="' + i + '">' +
      '<span class="t">' + esc(q.description) + "</span>" +
      '<span class="amt">' + money(q.total_cents) + "</span></div>").join("");
  [...$("queue").children].forEach(el =>
    el.onclick = () => { idx = +el.dataset.i; render(); });
}

async function decide(relevance) {
  const it = items[idx];
  if (!it) return;
  // A 'boat' verdict without a system leaves the item in the queue, so send the
  // selected system with it; 'personal' needs no system at all.
  const body = {
    item_id: it.id,
    relevance: relevance,
    system_key: relevance === "boat" ? ($("sys") || {}).value : null,
    apply_to_order: applyOrder && it.order_items > 1,
  };
  const res = await fetch("/api/review/decide", {
    method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
  if (!res.ok) { toast("Failed: " + res.status); return; }
  const data = await res.json();
  undoStack.push(data.previous);
  toast(relevance === "boat" ? "Marked boat" + (data.count > 1 ? " ×" + data.count : "")
                             : "Marked personal" + (data.count > 1 ? " ×" + data.count : ""));
  await load();
}

async function undo() {
  const previous = undoStack.pop();
  if (!previous) return;
  const res = await fetch("/api/review/restore", {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify(previous)});
  if (!res.ok) { toast("Undo failed: " + res.status); return; }
  toast("Undone");
  await load();
}

document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const tag = (e.target.tagName || "").toLowerCase();
  if (tag === "select" || tag === "input") {
    if (e.key === "Escape") e.target.blur();
    return;
  }
  const k = e.key.toLowerCase();
  if (k === "b") { e.preventDefault(); decide("boat"); }
  else if (k === "p") { e.preventDefault(); decide("personal"); }
  else if (k === "s") { e.preventDefault(); ($("sys") || {}).focus?.(); }
  else if (k === "z") { e.preventDefault(); undo(); }
  else if (k === "o") {
    e.preventDefault();
    const box = $("ord");
    if (box && !box.disabled) { box.checked = !box.checked; applyOrder = box.checked; }
  }
  else if (k === "j" || e.key === "ArrowDown") {
    e.preventDefault(); if (items.length) { idx = (idx + 1) % items.length; render(); } }
  else if (k === "k" || e.key === "ArrowUp") {
    e.preventDefault();
    if (items.length) { idx = (idx - 1 + items.length) % items.length; render(); } }
});

load();
</script>
</body>
</html>
